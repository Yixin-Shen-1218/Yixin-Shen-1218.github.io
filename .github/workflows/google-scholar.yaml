name: Update Google Scholar Stats

on:
  schedule:
    # Every Monday at 00:00 UTC (08:00 UTC+8)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scholarly
        run: |
          python -m pip install "scholarly==1.7.11" "bibtexparser==1.4.3"

      - name: Fetch Google Scholar stats
        timeout-minutes: 3
        run: |
          python -u <<'EOF'
          import json
          import time
          from scholarly import scholarly

          start = time.monotonic()

          print("Step 1: Fetching author ID...", flush=True)
          author = scholarly.search_author_id("Z_wN_FUAAAAJ")
          print(f"Step 1 completed: {time.monotonic()-start:.1f}s", flush=True)

          print("Step 2: Fetching author details...", flush=True)
          author = scholarly.fill(author)
          print(f"Step 2 completed: {time.monotonic()-start:.1f}s", flush=True)

          citations = author["citedby"]
          print(f"Citations: {citations}", flush=True)

          data = {
              "schemaVersion": 1,
              "label": "citations",
              "message": str(citations),
              "color": "9cf"
          }

          with open("gs_data_shieldsio.json", "w") as f:
              json.dump(data, f)

          print("Google Scholar stats updated successfully.")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gs_data_shieldsio.json

          if git diff --cached --quiet; then
            echo "No citation changes. Skipping commit."
          else
            git commit -m "Update Google Scholar stats"
            git push
          fi
