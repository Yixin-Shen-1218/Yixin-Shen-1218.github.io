name: Update Google Scholar Stats

on:
  schedule:
    # Every Monday 00:00 UTC = 08:00 Beijing time
    - cron: '0 0 * * 1'

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install requests
      - name: Install dependencies
        run: |
          python -m pip install "requests>=2.31,<3"

      # 4. Fetch citations from SerpApi
      - name: Fetch Google Scholar stats
        timeout-minutes: 2
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python -u <<'PY'
          import os
          import sys
          import json
          import requests

          AUTHOR_ID = "Z_wN_FUAAAAJ"
          OUTPUT_FILE = "gs_data_shieldsio.json"
          API_URL = "https://serpapi.com/search.json"

          api_key = os.getenv("SERPAPI_API_KEY")

          if not api_key:
              sys.exit("ERROR: SERPAPI_API_KEY is missing.")

          print("Fetching Google Scholar citations via SerpApi...")

          params = {
              "engine": "google_scholar_author",
              "author_id": AUTHOR_ID,
              "hl": "en",
              "api_key": api_key
          }

          try:
              response = requests.get(
                  API_URL,
                  params=params,
                  timeout=(10, 45)
              )
          except requests.RequestException:
              sys.exit("ERROR: SerpApi network request failed.")

          print("HTTP status:", response.status_code)

          if response.status_code != 200:
              sys.exit("ERROR: SerpApi returned a non-200 status.")

          try:
              result = response.json()
          except ValueError:
              sys.exit("ERROR: Invalid JSON response.")

          if result.get("error"):
              sys.exit("ERROR: SerpApi reported an API error.")

          status = result.get("search_metadata", {}).get("status")
          print("API status:", status)

          if status != "Success":
              sys.exit("ERROR: SerpApi search was not successful.")

          # Extract total Google Scholar citations
          citation_table = result.get(
              "cited_by", {}
          ).get("table", [])

          citations = None

          for item in citation_table:
              if "citations" in item:
                  citations = item["citations"].get("all")
                  break

          if (
              not isinstance(citations, int)
              or isinstance(citations, bool)
              or citations < 0
          ):
              sys.exit("ERROR: Invalid citation count.")

          print("Total citations:", citations)

          # Preserve the existing Shields.io JSON format
          data = {
              "schemaVersion": 1,
              "label": "citations",
              "message": str(citations),
              "color": "9cf"
          }

          # Avoid rewriting when citation count is unchanged
          if os.path.exists(OUTPUT_FILE):
              try:
                  with open(OUTPUT_FILE, "r", encoding="utf-8") as f:
                      old_data = json.load(f)

                  if old_data == data:
                      print("Citation data unchanged.")
                      sys.exit(0)
              except (OSError, ValueError):
                  print("Existing JSON unreadable; replacing it.")

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Citation data updated successfully.")
          PY

      # 5. Commit and push only if data changed
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add gs_data_shieldsio.json

          if git diff --cached --quiet; then
            echo "No changes. Skipping commit."
          else
            git commit -m "Update Google Scholar citations"
            git push
            echo "Citation data pushed successfully."
          fi
