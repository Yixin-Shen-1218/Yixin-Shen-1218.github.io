name: Update Google Scholar Stats

on:
  schedule:
    # Every Monday at 00:00 UTC (08:00 Beijing time)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scholarly
        run: |
          python -m pip install \
            "scholarly==1.7.11" \
            "bibtexparser==1.4.3"

      # Diagnostic request to identify network problems
      - name: Test Google Scholar connectivity
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          url = "https://scholar.google.com/citations?user=Z_wN_FUAAAAJ&hl=en"

          try:
              r = requests.get(url, timeout=20)

              print("HTTP status:", r.status_code)
              print("Final URL:", r.url)
              print("Response bytes:", len(r.content))

              soup = BeautifulSoup(r.text, "html.parser")

              print("Page title:",
                    soup.title.get_text(strip=True)
                    if soup.title else "None")

              print("Canonical link:",
                    bool(soup.find("link", rel="canonical")))

              print("Scholar profile:",
                    bool(soup.select_one("#gsc_prf_in")))

              print("Citation table:",
                    bool(soup.select_one("#gsc_rsb_st")))

              if "captcha" in r.text.lower() or "unusual traffic" in r.text.lower():
                  print("WARNING: Possible Google Scholar access restriction")

          except requests.RequestException as e:
              print("Network error:", repr(e))
              raise
          PY


      # Fetch citations with visible progress and timeout
      - name: Fetch Google Scholar stats
        timeout-minutes: 3
        run: |
          python -u <<'EOF'
          import json
          import time
          from scholarly import scholarly

          AUTHOR_ID = "Z_wN_FUAAAAJ"
          OUTPUT_FILE = "gs_data_shieldsio.json"

          start = time.monotonic()

          print("Step 1: Fetching author ID...", flush=True)

          author = scholarly.search_author_id(AUTHOR_ID)

          print(
              f"Step 1 completed in "
              f"{time.monotonic()-start:.1f}s",
              flush=True
          )

          print("Step 2: Fetching author details...", flush=True)

          author = scholarly.fill(author)

          print(
              f"Step 2 completed in "
              f"{time.monotonic()-start:.1f}s",
              flush=True
          )

          citations = author["citedby"]

          print(f"Total citations: {citations}", flush=True)

          data = {
              "schemaVersion": 1,
              "label": "citations",
              "message": str(citations),
              "color": "9cf"
          }

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(
              "Google Scholar stats updated successfully.",
              flush=True
          )
          EOF

      # Commit only when citation data changes
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add gs_data_shieldsio.json

          if git diff --cached --quiet; then
            echo "No citation changes. Skipping commit."
          else
            git commit -m "Update Google Scholar stats"
            git push
          fi
